notes: >
  教工名录按“系所 → 职称分组 → 姓名”静态渲染；链接 data-name 属性带职称。
  详情页为学院统一教师主页系统（life.sjtu.edu.cn/teacher/<id>），含基本信息、学术经历、研究方向、代表论著、承担项目。
  “支撑队伍”分组也在同一页，作为采购执行人线索保留，岗位类型标为“支撑”。
