# 实验技术 → 远赞产品线映射。销售/产品团队可直接改这份文件，不需要改代码。
# keywords 命中研究方向、简介、论文、项目文本中的任意一个即打上该技术标签。
# wet: false 表示偏干实验（计算/理论），会降低优先级。
products:
  pipette: 手动移液器
  tips: 通用吸头
  pcr_strip: PCR 八连管
  pcr_plate: PCR 板
  flask: 细胞培养瓶
  dish_plate: 细胞培养皿/板
  tube: 离心管
  cryo: 冻存管

techniques:
  细胞培养:
    keywords: [细胞培养, 细胞系, 类器官, 干细胞, 原代细胞, 肿瘤细胞, 细胞治疗, CAR-T, iPSC, organoid, cell line, 细胞模型, 细胞生物学]
    keywords_en: ["cell culture", "cell line", "organoid", "stem cell", "ipsc", "primary cell", "car-t", "cultured cells", "hela", "hek293"]
    products: [flask, dish_plate, tube, tips, pipette, cryo]
  PCR/qPCR:
    keywords: [PCR, qPCR, RT-PCR, 基因表达, 分子诊断, 核酸检测, 基因检测, 定量检测, 分子标记]
    keywords_en: ["pcr", "qpcr", "rt-qpcr", "polymerase chain reaction", "gene expression profiling", "molecular diagnos"]
