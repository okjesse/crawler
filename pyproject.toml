[project]
name = "faculty-crawler"
version = "0.1.0"
description = "高校教师画像抓取流水线（远赞生命科学耗材销售支持）"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=1.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
fcrawl = "faculty_crawler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faculty_crawler = ["templates/*.yaml", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
